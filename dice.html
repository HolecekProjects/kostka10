<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Kouzelná kostka D10</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.pubnub.com/sdk/javascript/pubnub.7.2.2.min.js"></script>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #ecf0f1; }
        .dice-container {
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        #dice-text { 
            width: 250px;
            height: 250px;
            user-select: none; 
            display: block; 
        }
        #dice-text svg { width: 100%; height: 100%; display: block; }
        #dice-face { fill: #ffffff; stroke: #2c3e50; stroke-width: 6; stroke-linejoin: round; }
        .dice-edges { fill: none; stroke: #2c3e50; stroke-width: 3; stroke-linejoin: round; opacity: 0.35; }
        #dice-number { fill: #2c3e50; font-family: 'Segoe UI', sans-serif; font-weight: bold; }
        #dice-image {
            width: 250px; 
            height: 250px;
            object-fit: contain;
            display: none; 
            border-radius: 15px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); 
        }
        #roll-btn { 
            padding: 20px 60px; 
            font-size: 24px; 
            font-weight: bold; 
            background-color: #95a5a6; 
            color: white; 
            border: none; 
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 6px #7f8c8d; 
            transition: all 0.2s; 
        }
        #roll-btn:active { 
            transform: translateY(4px); 
            box-shadow: 0 2px #7f8c8d; 
        }
        .shake { animation: shake 0.5s linear infinite; }
        @keyframes shake { 
            0% { transform: rotate(0deg); } 
            25% { transform: rotate(15deg); } 
            50% { transform: rotate(-15deg); } 
            75% { transform: rotate(5deg); } 
            100% { transform: rotate(0deg); } 
        }
    </style>
</head>
<body>

    <div class="dice-container">
        <div id="dice-text">
            <!-- Desetistěnná kostka (D10) – Unicode má symboly jen pro 1–6, proto SVG -->
            <svg viewBox="0 0 250 250" aria-label="D10">
                <polygon id="dice-face" points="125,8 238,105 125,242 12,105" />
                <polyline class="dice-edges" points="12,105 70,125 125,95 180,125 238,105" />
                <polyline class="dice-edges" points="70,125 125,242 180,125" />
                <text id="dice-number" x="125" y="168" text-anchor="middle" font-size="90">1</text>
            </svg>
        </div>

        <img id="dice-image" 
             src="img15851-3128377369.jpg" 
             onerror="this.src='https://cdn-icons-png.flaticon.com/512/1500/1500427.png'"
             alt="Kostka se točí...">
    </div>

    <button id="roll-btn" onclick="rollDice()">Připojování...</button>

    <script>
        // VAŠE OVĚŘENÉ KLÍČE
        const pubnub = new PubNub({
            publishKey: 'pub-c-c1d5c7b7-7467-4989-86a9-42958a2901c5',
            subscribeKey: 'sub-c-bd13d5e2-ee09-4bbf-b6e5-ad3e7b530f2b',
            uuid: PubNub.generateUUID()
        });
        
        // Zde Kostka naslouchá na signál z Ovladače
        const channel = 'magic_d10_channel'; 
        // Zde Kostka posílá výsledek na Arduino/externí zařízení
        const outputChannel = 'arduino_d10_output'; 

        let forcedOutcome = 0;
        let lastRolledNumber = 0; 
        let isConnected = false;

        const rollButton = document.getElementById('roll-btn');

        // Automatické reconnecty
        function checkConnectionAndReconnect() {
            if (!isConnected) {
                pubnub.reconnect();
            }
        }
        setInterval(checkConnectionAndReconnect, 1500);

        // PubNub Listener
        pubnub.subscribe({ channels: [channel] });
        pubnub.addListener({
            status: function(s) { 
                const category = s.category;
                if (category.includes("Connected") || category.includes("Restored")) {
                    isConnected = true;
                    rollButton.textContent = "Roztočit kostku"; 
                    rollButton.style.backgroundColor = "#3498db";
                    rollButton.style.boxShadow = "0 6px #2980b9";
                } else if (category.includes("Disconnected") || category.includes("NetworkDown")) {
                    isConnected = false;
                    rollButton.textContent = "Připojování...";
                    rollButton.style.backgroundColor = "#95a5a6";
                }
            },
            message: function(m) { 
                // Zachytává magický signál z Ovladače
                forcedOutcome = m.message.forceVal; 
                console.log("Magic signal set to: " + forcedOutcome); 
            }
        });

        function rollDice() {
            if (!isConnected) {
                alert("Počkejte, připojujeme se k magické síti...");
                return;
            }

            const diceText = document.getElementById('dice-text');
            const diceImage = document.getElementById('dice-image');
            const btn = document.getElementById('roll-btn');

            // 1. Start Animace
            btn.disabled = true; 
            diceText.style.display = 'none';
            diceImage.style.display = 'block';
            diceImage.classList.add('shake');

            // 2. Určení výsledku po 3 sekundách
            setTimeout(() => {
                let num;
                if (forcedOutcome === 0) {
                    // Náhodný režim (vynucení náhody, pokud ovladač nezasáhl)
                    do {
                        num = Math.floor(Math.random() * 10) + 1; 
                    } while (num === lastRolledNumber);
                } else {
                    // Magický režim (vynucení výsledku z ovladače)
                    num = forcedOutcome; 
                }

                // 3. Odeslání výsledku (např. pro Arduino)
                pubnub.publish({ 
                    channel: outputChannel, 
                    message: { roll: num } 
                });

                lastRolledNumber = num;

                // 4. Zobrazení výsledku
                diceImage.classList.remove('shake'); 
                diceImage.style.display = 'none';
                const numberEl = document.getElementById('dice-number');
                numberEl.textContent = num;
                numberEl.setAttribute('font-size', num === 10 ? 80 : 90); // číslo na D10
                diceText.style.display = 'block';
                
                btn.disabled = false; 
            }, 3000); // 3 vteřiny animace
        }
    </script>
</body>
</html>
